name: core

# Rebuilds the patched pcsx_rearmed core and OpenBIOS from source and checks
# that the binaries committed in data/ are exactly what core/ builds (the core
# build is reproducible: same sources, same bytes, wherever it runs). When the
# sources change, commit the uploaded artifacts.
on:
  workflow_dispatch:
  pull_request:
    paths: ['core/**', '.github/workflows/core.yml']
  push:
    branches: [main]
    paths: ['core/**', '.github/workflows/core.yml']

jobs:
  pcsx_rearmed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y p7zip-full
      - name: Committed checksums
        run: cp data/cores/reports/pcsx_rearmed-ps1test.json /tmp/committed.json
      - run: core/build-core.sh "$RUNNER_TEMP/core"
      - name: Compare with the committed core
        run: |
          python3 - <<'PY'
          import json
          a = json.load(open('/tmp/committed.json'))['sha256']
          b = json.load(open('data/cores/reports/pcsx_rearmed-ps1test.json'))['sha256']
          for k in a:
              print(f"{k}: committed {a[k]}  built {b[k]}  {'same' if a[k] == b[k] else 'DIFFERENT'}")
          if a != b:
              # The build is reproducible (build-core.sh maps build paths away), so
              # the committed binaries must be exactly what core/ builds. When core/
              # changes, commit this job's artifact (or run core/build-core.sh).
              print('::error::data/cores does not match a rebuild from core/: commit the rebuilt cores (this job\'s artifact)')
              raise SystemExit(1)
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcsx_rearmed-ps1test
          path: |
            data/cores/pcsx_rearmed-wasm.data
            data/cores/pcsx_rearmed-legacy-wasm.data
            data/cores/reports/pcsx_rearmed-ps1test.json

  openbios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-mipsel-linux-gnu g++-mipsel-linux-gnu
      - name: Rebuild at the committed commit
        run: core/build-openbios.sh "$(python3 -c "import json; print(json.load(open('data/bios/openbios.json'))['commit'])")"
      - name: Compare
        run: git diff --stat --exit-code -- data/bios/openbios.bin || echo "::warning::OpenBIOS rebuild differs from the committed image"
      - uses: actions/upload-artifact@v4
        with:
          name: openbios
          path: data/bios/
