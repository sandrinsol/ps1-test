name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [20, 22, 24]
        include:
          - os: macos-latest
            node: 22
    defaults:
      run:
        working-directory: harness
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: harness/package-lock.json

      # Skip the postinstall playwright download here; the browser is cached below.
      - run: npm ci --ignore-scripts

      - name: Playwright version
        id: pw
        shell: bash
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # Downloads only on a cache miss; on Linux also installs the system libraries.
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - if: runner.os != 'Linux'
        run: npx playwright install chromium

      - if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm run typecheck

      # Boots pcsx_rearmed headlessly (software WebGL via SwiftShader) and runs
      # the suites: unit (EXE/disc/symbol parsing), core (driver end to end with
      # OpenBIOS and HLE), script (CLI runner + goldens) and mcp (the server).
      - run: npm test

      # npm pack -> install into an empty project -> drive an EXE through the bin.
      - if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm run package-test

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ matrix.os }}-node${{ matrix.node }}
          path: harness/out/
          if-no-files-found: ignore

  template:
    # templates/psn00bsdk built with PSn00bSDK and driven through the MCP server
    # (new_project, build, its smoke test, check).
    name: psn00bsdk template
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: harness/package-lock.json
      - name: Cache PSn00bSDK
        id: sdk
        uses: actions/cache@v4
        with:
          path: /opt/psn00bsdk
          key: psn00bsdk-v0.24-${{ hashFiles('templates/psn00bsdk/.devcontainer/install-psn00bsdk.sh', 'templates/psn00bsdk/.devcontainer/elf2x-ptload.patch') }}
      - name: Install the MIPS toolchain and PSn00bSDK
        run: |
          if [ "${{ steps.sdk.outputs.cache-hit }}" = true ]; then
            sudo apt-get update && sudo apt-get install -y gcc-mipsel-linux-gnu binutils-mipsel-linux-gnu ninja-build
          else
            sudo ../templates/psn00bsdk/.devcontainer/install-psn00bsdk.sh /opt/psn00bsdk
          fi
          echo "PSN00BSDK_LIBS=/opt/psn00bsdk/lib/libpsn00b" >> "$GITHUB_ENV"
          echo "/opt/psn00bsdk/bin" >> "$GITHUB_PATH"
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: node tests/template.mjs

  fixtures:
    # The committed test fixtures must match their sources.
    name: fixtures rebuild
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y gcc-mipsel-linux-gnu
      - run: node harness/tests/fixtures/build.mjs
      - name: fixtures unchanged
        run: git diff --exit-code -- harness/tests/fixtures
