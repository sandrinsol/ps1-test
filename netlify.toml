# Static site — no build step. Netlify just serves these files.
[build]
  publish = "."
  command = ""

# Immutable core assets (never edited): cache them hard.
[[headers]]
  for = "/data/cores/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/data/compression/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# EmulatorJS engine/loader/css DO get edited — cache briefly and revalidate so a
# redeploy is picked up instead of serving stale JS.
[[headers]]
  for = "/data/emulator.min.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/data/loader.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/data/emulator.min.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Serve WebAssembly with the correct MIME type.
[[headers]]
  for = "/data/compression/libunrar.wasm"
  [headers.values]
    Content-Type = "application/wasm"

# The bundled core is single-threaded, so cross-origin isolation is NOT required.
# If you ever set EJS_threads=true (faster, uses SharedArrayBuffer), uncomment the
# two headers below to make the emulator cross-origin isolated:
# [[headers]]
#   for = "/*"
#   [headers.values]
#     Cross-Origin-Opener-Policy = "same-origin"
#     Cross-Origin-Embedder-Policy = "require-corp"

# The bundled OpenBIOS image is fixed per release.
[[headers]]
  for = "/data/bios/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
