<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PS1 Emulator</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 16px;
      background: #16161e;
      color: #e6e6ee;
      font-family: system-ui, -apple-system, sans-serif;
    }
    h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: .5px; }
    #picker {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 32px 16px;
      max-width: 560px;
      text-align: center;
    }
    label.btn {
      background: #5a4fff;
      color: #fff;
      padding: 12px 22px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      transition: background .15s;
    }
    label.btn:hover { background: #6d63ff; }
    small { color: #8a8a9a; line-height: 1.5; }
    fieldset { border: 1px solid #33334a; border-radius: 10px; padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 10px 16px; justify-content: center; }
    legend { color: #8a8a9a; font-size: 13px; padding: 0 6px; }
    fieldset label { font-size: 14px; cursor: pointer; }
    #biosFileRow[hidden] { display: none; }
    #error { color: #ff7a7a; }
    #box {
      width: 100%;
      max-width: 800px;
      aspect-ratio: 4 / 3;
    }
    #game { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <h1>PS1 Emulator</h1>

  <div id="picker">
    <label class="btn">
      Load disc or EXE
      <input id="rom" type="file" accept=".cue,.bin,.iso,.img,.exe,.psx,.pbp,.zip,.7z" multiple hidden />
    </label>
    <small>
      Pick a disc image (<code>.cue</code> together with its <code>.bin</code> files, or a
      single <code>.bin</code>/<code>.iso</code>), a homebrew <code>.exe</code>, or a
      <code>.zip</code>. Runs 100% offline.
    </small>
    <fieldset>
      <legend>BIOS</legend>
      <label><input type="radio" name="bios" value="openbios" checked /> OpenBIOS (bundled)</label>
      <label><input type="radio" name="bios" value="hle" /> Built-in (HLE)</label>
      <label><input type="radio" name="bios" value="file" /> My BIOS file…</label>
      <span id="biosFileRow" hidden><input id="biosFile" type="file" accept=".bin,.rom" /></span>
    </fieldset>
    <small>A Sony BIOS dump (e.g. SCPH1001, 512 KB) gives the best compatibility and the
      memory card manager; it stays on your computer.</small>
    <small id="error"></small>
  </div>

  <div id="box" hidden>
    <div id="game"></div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    for (const r of document.querySelectorAll('input[name=bios]')) {
      r.addEventListener('change', () => { $('biosFileRow').hidden = r.value !== 'file' || !r.checked; });
    }

    // A .cue names its track files, and EmulatorJS loads one file: put a .cue and
    // its tracks into an uncompressed zip, which EmulatorJS unpacks.
    const CRC = new Int32Array(256).map((_, n) => { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; return c; });
    const crc32 = (b) => { let c = -1; for (let i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 0xff] ^ (c >>> 8); return (c ^ -1) >>> 0; };
    async function zipStore(files) {
      const parts = [], central = [];
      let off = 0;
      for (const f of files) {
        const data = new Uint8Array(await f.arrayBuffer()), name = new TextEncoder().encode(f.name), crc = crc32(data);
        const h = new DataView(new ArrayBuffer(30));
        h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x800, true);
        h.setUint32(14, crc, true); h.setUint32(18, data.length, true); h.setUint32(22, data.length, true); h.setUint16(26, name.length, true);
        const c = new DataView(new ArrayBuffer(46));
        c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x800, true);
        c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true); c.setUint16(28, name.length, true); c.setUint32(42, off, true);
        parts.push(h, name, data); central.push(c, name);
        off += 30 + name.length + data.length;
      }
      const cdSize = central.reduce((n, p) => n + p.byteLength, 0);
      const end = new DataView(new ArrayBuffer(22));
      end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
      end.setUint32(12, cdSize, true); end.setUint32(16, off, true);
      return new Blob([...parts, ...central, end]);
    }

    $('rom').addEventListener('change', async (e) => {
      const files = [...e.target.files];
      if (!files.length) return;
      const ext = (f) => f.name.split('.').pop().toLowerCase();
      const cue = files.find((f) => ext(f) === 'cue');
      let game = files[0];
      if (cue) {
        const names = [...(await cue.text()).matchAll(/^\s*FILE\s+(?:"([^"]+)"|(\S+))/gim)].map((m) => (m[1] ?? m[2]).split(/[\\/]/).pop());
        const missing = names.filter((n) => !files.some((f) => f.name === n));
        if (missing.length) { $('error').textContent = `${cue.name} needs ${missing.join(', ')} too: select the .cue and its track files together.`; return; }
        game = new File([await zipStore([cue, ...files.filter((f) => names.includes(f.name))])], cue.name.replace(/\.cue$/i, '.zip'));
      }
      const bios = document.querySelector('input[name=bios]:checked').value;
      if (bios === 'file' && !$('biosFile').files[0]) { $('error').textContent = 'Pick your BIOS file first.'; return; }

      $('picker').hidden = true;
      $('box').hidden = false;

      // EmulatorJS configuration — it does all the actual emulation, with the
      // pcsx_rearmed core. Everything is served from the local data/ folder.
      window.EJS_player = '#game';
      window.EJS_core = 'psx';
      window.EJS_gameName = game.name.replace(/\.[^.]+$/, '');
      window.EJS_gameUrl = URL.createObjectURL(game);
      window.EJS_pathtodata = 'data/';
      window.EJS_startOnLoaded = true;
      // The core finds a BIOS in its system folder by file name.
      if (bios === 'openbios') window.EJS_biosUrl = 'data/bios/openbios.bin';
      if (bios === 'file') window.EJS_biosUrl = new File([$('biosFile').files[0]], 'scph1001.bin');
      window.EJS_defaultOptions = { pcsx_rearmed_bios: bios === 'hle' ? 'HLE' : 'auto', pcsx_rearmed_memcard2: 'enabled' };
      // Use the built-in English UI so no localization file is fetched.
      window.EJS_language = 'en-US';
      window.EJS_disableAutoLang = false;

      const s = document.createElement('script');
      s.src = 'data/loader.js';
      document.body.appendChild(s);
    });
  </script>
</body>
</html>
